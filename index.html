<!DOCTYPE html>

  <title>Absensi Online IPM</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    /* ===== WELCOME PAGE ===== */
    #welcome {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .logo {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .logo img {
      width: 60px;
      height: auto;
    }

    .judul {
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }

    button {
      width: 80%;
      max-width: 320px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin: 6px auto;
      display: block;
    }

    button:hover {
      background: #1e40af;
    }

    /* ===== DASHBOARD ===== */
    #dashboard {
      display: none;
      padding: 20px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    /* ===== WATERMARK ===== */
    .wm {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #999;
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
